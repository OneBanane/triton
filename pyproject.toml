[project]
name = "triton"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "OneBanane", email = "eliseynimka@gmail.com" }
]
requires-python = ">=3.9"

dependencies = [
    "torch>=2.0.0",
    "lightning>=2.0.0",
    "polars>=1.36.1",
    "hydra-core>=1.3.7",
    "onnx>=1.19.1",
]

[project.scripts]
triton = "triton:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
load = [
    "locust>=2.32,<3",
]
dev = [
    "ipykernel>=6.31.0",
    "jupyter>=1.1.1",
    "ruff>=0.16.9",
    "pre-commit>=4.3.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["load"]
